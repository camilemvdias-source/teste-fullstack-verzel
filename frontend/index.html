<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurelia · Leilões de Arte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Tema escolhido antes da primeira pintura (evita piscar claro → escuro)
      try {
        var t = localStorage.getItem('leilao_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Pré-carregamento: aparece antes do JavaScript e some quando a API responde */
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f4ede1; color: #2a201c; font-family: Montserrat, system-ui, sans-serif; transition: opacity .25s; }
      #boot b { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.9rem; font-weight: 500; font-style: italic; }
      #boot .bar { width: 160px; height: 2px; background: #d9d2c3; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #5c1a22; animation: boot 1.1s ease-in-out infinite; }
      #boot p { margin: 0; font-size: 0.9rem; color: #847d70; min-height: 1.4em; text-align: center; padding: 0 16px; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #boot { background: #13120f; color: #ecebe7; } :root:not([data-theme='light']) #boot .bar { background: #2e2c29; } :root:not([data-theme='light']) #boot .bar i { background: #ecebe7; } }
      :root[data-theme='dark'] #boot { background: #13120f; color: #ecebe7; }
      :root[data-theme='dark'] #boot .bar { background: #2e2c29; }
      :root[data-theme='dark'] #boot .bar i { background: #ecebe7; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <b><span style="display:inline-grid;place-items:center;width:40px;height:40px;background:#5c1a22;color:#f4ede1;outline:1px solid #c9a464;outline-offset:-5px;margin-right:14px;vertical-align:middle;font-size:1.5rem;font-style:normal">A</span><span style="letter-spacing:.3em;text-transform:uppercase;font-style:normal;font-weight:500">Aurelia</span></b>
      <div class="bar"><i></i></div>
      <p id="boot-msg">Carregando o catálogo…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
