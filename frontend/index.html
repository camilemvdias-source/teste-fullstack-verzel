<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurelia · Leilões de Arte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      // Tema escolhido antes da primeira pintura (evita piscar claro → escuro)
      try {
        var t = localStorage.getItem('leilao_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Pré-carregamento: aparece antes do JavaScript e some quando a API responde */
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #faf7f2; color: #211d1a; font-family: 'Source Sans 3', system-ui, sans-serif; transition: opacity .25s; }
      #boot b { font-family: 'Source Serif 4', Georgia, serif; font-size: 1.9rem; font-weight: 600; }
      #boot .bar { width: 160px; height: 2px; background: #e3e0da; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #6e1f1a; animation: boot 1.1s ease-in-out infinite; }
      #boot p { margin: 0; font-size: 0.9rem; color: #6f6b64; min-height: 1.4em; text-align: center; padding: 0 16px; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #boot { background: #141413; color: #ecebe7; } :root:not([data-theme='light']) #boot .bar { background: #2e2c29; } :root:not([data-theme='light']) #boot .bar i { background: #ecebe7; } }
      :root[data-theme='dark'] #boot { background: #141413; color: #ecebe7; }
      :root[data-theme='dark'] #boot .bar { background: #2e2c29; }
      :root[data-theme='dark'] #boot .bar i { background: #ecebe7; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <svg width="48" height="48" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#6e1f1a"/><circle cx="20" cy="20" r="15.5" fill="none" stroke="#fffaf3" stroke-opacity=".55" stroke-width=".8"/><text x="20.6" y="27.4" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-style="italic" font-size="21" fill="#fffaf3">A</text></svg>
      <div class="bar"><i></i></div>
      <p id="boot-msg">Carregando o catálogo…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
